server {
    listen 80;
    server_name localhost;

    # Security Headers for ZAP Scan compliance (Anti-XSS, Anti-Clickjacking, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss: http://localhost:8080 http://127.0.0.1:8080;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Hỗ trợ Vue Router history mode
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API đến backend (tránh lỗi CORS nếu gọi cùng domain)
    # location /api/v1/ {
    #     proxy_pass http://backend:8080/api/v1/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
