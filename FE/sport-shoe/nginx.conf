server {
    listen 80;
    server_name sportshoestore.duckdns.org localhost 100.55.159.191;

    # Cấu hình nén Gzip để tăng tốc độ truyền tải qua mạng
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Security Headers for ZAP Scan compliance
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # PosMobile App
    location /pos-mobile {
        alias /usr/share/nginx/html/pos-mobile;
        index index.html;
        try_files $uri $uri/ /pos-mobile/index.html;
    }

    location /_expo/ {
        root /usr/share/nginx/html/pos-mobile;
        try_files $uri =404;
    }

    location /assets/node_modules/ {
        root /usr/share/nginx/html/pos-mobile;
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API đến backend
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy các request WebSocket đến backend
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy các request uploads hình ảnh đến backend
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sportshoestore.duckdns.org localhost 100.55.159.191;

    ssl_certificate /etc/letsencrypt/live/sportshoestore.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportshoestore.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cấu hình nén Gzip
