server {
    listen 80;
    server_name sportshoestore.duckdns.org;
    
    # Chuyển hướng tự động từ HTTP sang HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sportshoestore.duckdns.org;

    # Cấu hình đường dẫn chứng chỉ SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/sportshoestore.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportshoestore.duckdns.org/privkey.pem;

    # Tối ưu hóa bảo mật SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cấu hình nén Gzip để tăng tốc độ truyền tải qua mạng
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Security Headers for ZAP Scan compliance (Anti-XSS, Anti-Clickjacking, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' ws: wss: https: http://localhost:8080 http://127.0.0.1:8080;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Hỗ trợ Vue Router history mode
        try_files $uri $uri/ /index.html;
    }

    # Proxy các request API đến backend (tránh lỗi CORS nếu gọi cùng domain)
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy các request WebSocket đến backend
    location /ws {
        proxy_pass http://backend:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy các request uploads hình ảnh đến backend
    location /uploads/ {
        proxy_pass http://backend:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
