name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Thay đổi thành master nếu nhánh chính của bạn là master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./BE/server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sportshoe-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./FE/sport-shoe/package-lock.json

      - name: Build Frontend Assets
        run: |
          cd ./FE/sport-shoe
          npm ci
          npm run build

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./FE/sport-shoe
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/sportshoe-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/SportShoe-Store
            # Pull ảnh mới nhất từ Docker Hub
            docker compose pull
            # Khởi động lại các container bằng ảnh mới
            docker compose up -d --remove-orphans
            # Dọn dẹp các Docker image cũ để tránh đầy ổ cứng
            docker image prune -f
