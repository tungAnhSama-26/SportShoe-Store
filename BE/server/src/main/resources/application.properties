
spring.application.name=server
spring.config.import=optional:classpath:application-local.properties

server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok

spring.jackson.time-zone=Asia/Bangkok
spring.jackson.default-property-inclusion=non_null

app.api.base-path=/api/v1
app.cors.allowed-origins[0]=http://localhost:*
app.cors.allowed-origins[1]=http://127.0.0.1:*
app.cors.allowed-origins[2]=http://0.0.0.0:*
app.cors.allowed-origins[3]=http://192.168.*:*
app.cors.allowed-origins[4]=http://10.*:*
app.cors.allowed-origins[5]=http://172.*:*
app.cors.allowed-origins[6]=null
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=100
app.websocket.endpoint=/ws
app.websocket.topic-prefix=/topic
app.websocket.queue-prefix=/queue
app.websocket.application-prefix=/app
app.websocket.allowed-origins[0]=http://localhost:*
app.websocket.allowed-origins[1]=http://127.0.0.1:*
app.websocket.allowed-origins[2]=http://0.0.0.0:*
app.websocket.allowed-origins[3]=http://192.168.*:*
app.websocket.allowed-origins[4]=http://10.*:*
app.websocket.allowed-origins[5]=http://172.*:*
app.websocket.allowed-origins[6]=null
app.debug-errors=false
app.returns.request-window-days=3
app.returns.shipment-window-days=7
app.returns.expiration-check-ms=60000

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# GHN dev shipping fee API. Override these values in application-local.properties.
ghn.base-url=https://dev-online-gateway.ghn.vn/shiip/public-api
ghn.token=
ghn.shop-id=0
ghn.from-district-id=0
ghn.from-ward-code=
ghn.default-length=30
ghn.default-width=20
ghn.default-height=12
ghn.default-weight=500
ghn.default-service-type-id=2

# SePay - nhận chuyển khoản thật qua VietQR. Điền giá trị thật trong application-local.properties.
sepay.api-key=
sepay.bank=
sepay.account-number=
sepay.account-name=
sepay.prefix=SHOE
