spring.application.name=server
spring.config.import=optional:classpath:application-local.properties

server.port=8080

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok

spring.jackson.time-zone=Asia/Bangkok
spring.jackson.default-property-inclusion=non_null

app.api.base-path=/api/v1
app.cors.allowed-origins[0]=http://localhost:5173
app.cors.allowed-origins[1]=http://127.0.0.1:5173
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=100
app.websocket.endpoint=/ws
app.websocket.topic-prefix=/topic
app.websocket.queue-prefix=/queue
app.websocket.application-prefix=/app
app.websocket.allowed-origins[0]=http://localhost:5173
app.websocket.allowed-origins[1]=http://127.0.0.1:5173
