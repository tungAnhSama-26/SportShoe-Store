spring.application.name=server
spring.config.import=optional:file:.env[.properties],optional:file:./BE/server/.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# Database Config
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Config
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
logging.level.org.hibernate.orm.incubating=ERROR

spring.jackson.time-zone=Asia/Bangkok
spring.jackson.default-property-inclusion=non_null

# Mail Config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.api.base-path=/api/v1
app.cors.allowed-origins[0]=http://localhost:*
app.cors.allowed-origins[1]=http://127.0.0.1:*
app.cors.allowed-origins[2]=http://0.0.0.0:*
app.cors.allowed-origins[3]=http://192.168.*:*
app.cors.allowed-origins[4]=http://10.*:*
app.cors.allowed-origins[5]=http://172.*:*
app.cors.allowed-origins[6]=https://*
app.cors.allowed-origins[7]=*
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=100
app.websocket.endpoint=/ws
app.websocket.topic-prefix=/topic
app.websocket.queue-prefix=/queue
app.websocket.application-prefix=/app
app.websocket.allowed-origins[0]=http://localhost:*
app.websocket.allowed-origins[1]=http://127.0.0.1:*
app.websocket.allowed-origins[2]=http://0.0.0.0:*
app.websocket.allowed-origins[3]=http://192.168.*:*
app.websocket.allowed-origins[4]=http://10.*:*
app.websocket.allowed-origins[5]=http://172.*:*
app.websocket.allowed-origins[6]=https://*
app.websocket.allowed-origins[7]=*
app.debug-errors=false
app.returns.request-window-days=3
app.returns.shipment-window-days=7
app.returns.expiration-check-ms=60000

# File Upload Settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# GHN Config
ghn.base-url=${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
ghn.token=${GHN_TOKEN}
ghn.shop-id=${GHN_SHOP_ID:0}
ghn.from-district-id=${GHN_FROM_DISTRICT_ID:0}
ghn.from-ward-code=${GHN_FROM_WARD_CODE}
ghn.default-length=30
ghn.default-width=20
ghn.default-height=12
ghn.default-weight=500
ghn.default-service-type-id=2
ghn.from-province-code=${GHN_FROM_PROVINCE_CODE:1}
ghn.fee-cache-file=${GHN_FEE_CACHE_FILE:data/ghn-fee-cache.json}
ghn.fee-cache-ttl-days=${GHN_FEE_CACHE_TTL_DAYS:30}

# Danh mục hành chính Việt Nam hai cấp (sau 01/07/2025).
# Backend có snapshot đóng gói để dropdown vẫn hoạt động khi máy local bị tắt mạng.
address.catalog.base-url=${ADDRESS_CATALOG_BASE_URL:https://provinces.open-api.vn/api}
address.catalog.cache-file=${ADDRESS_CATALOG_CACHE_FILE:${java.io.tmpdir}/sportshoe/vietnam-address-v2.json}

# VNPay Config
vnpay.tmn-code=${VNPAY_TMN_CODE:S8XQ7XI6}
vnpay.hash-secret=${VNPAY_HASH_SECRET:7WGJ5WPK0F3GABZ7YZVGT4GRR7T61FWC}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/client/vnpay/callback}

# SePay Config
sepay.api-key=${SEPAY_API_KEY}
sepay.bank=${SEPAY_BANK}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER}
sepay.account-name=${SEPAY_ACCOUNT_NAME}
sepay.prefix=${SEPAY_PREFIX:SHOE}

# AI Chatbot Config
spring.ai.openai.enabled=false
spring.ai.openai.embedding.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

# Encoding Settings
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# High Concurrency Performance Tuning
# Tomcat server thread pool settings
server.tomcat.threads.max=500
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# HikariCP Database connection pool settings
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
