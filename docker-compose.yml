services:
  # 1. Database MSSQL Server 2022
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sportshoe-db
    ports:
      - "${DB_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-Yoasobi123.}
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' 2>/dev/null) || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 10s
    restart: unless-stopped

  # 2. Database Auto-Init (Tự động tạo database 'giay' & nạp schema + dữ liệu lần đầu)
  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sportshoe-db-init
    environment:
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-Yoasobi123.}
      - DB_HOST=database
    volumes:
      - ./database:/database:ro
    entrypoint: ["/bin/bash", "/database/init-db.sh"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # 3. Spring Boot Backend
  backend:
    build:
      context: ./BE/server
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-sportshoe}/backend:latest
    container_name: sportshoe-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_URL=jdbc:sqlserver://database:1433;databaseName=giay;encrypt=true;trustServerCertificate=true
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD:-Yoasobi123.}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - GHN_BASE_URL=${GHN_BASE_URL:-https://online-gateway.ghn.vn/shiip/public-api}
      - GHN_TOKEN=${GHN_TOKEN:-}
      - GHN_SHOP_ID=${GHN_SHOP_ID:-0}
      - GHN_FROM_DISTRICT_ID=${GHN_FROM_DISTRICT_ID:-0}
      - GHN_FROM_WARD_CODE=${GHN_FROM_WARD_CODE:-}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-}
      - VNPAY_PAY_URL=${VNPAY_PAY_URL:-}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-}
      - SEPAY_API_KEY=${SEPAY_API_KEY:-}
      - SEPAY_BANK=${SEPAY_BANK:-}
      - SEPAY_ACCOUNT_NUMBER=${SEPAY_ACCOUNT_NUMBER:-}
      - SEPAY_ACCOUNT_NAME=${SEPAY_ACCOUNT_NAME:-}
      - SEPAY_PREFIX=${SEPAY_PREFIX:-SHOE}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  # 4. Vue.js Frontend (Served by Nginx)
  frontend:
    build:
      context: ./FE/sport-shoe
      dockerfile: Dockerfile
    image: ${DOCKER_USERNAME:-sportshoe}/frontend:latest
    container_name: sportshoe-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
