version: '3.8'

services:
  backend:
    build:
      context: ./BE/server
      dockerfile: Dockerfile
    container_name: sportshoe-backend
    ports:
      - "8080:8080"
    env_file:
      - ./BE/server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./FE/sport-shoe
      dockerfile: Dockerfile
    container_name: sportshoe-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
