version: '3.8'

services:
  # 1. Container Microsoft SQL Server
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sportshoe-db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-MatKhauDatabaseCuaBan123!}
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Yoasobi123.\" -C -Q \"SELECT 1\" || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"Yoasobi123.\" -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # 2. Database Auto-Init (Tự động tạo database 'giay' & nạp schema + dữ liệu lần đầu)
  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sportshoe-db-init
    environment:
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-Yoasobi123.}
      - DB_HOST=database
    volumes:
      - ./database:/database:ro
    entrypoint: ["/bin/bash", "/database/init-db.sh"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  # 3. Ollama Local AI (fallback khi tất cả AI cloud thất bại)
  ollama:
    image: ollama/ollama:latest
    container_name: sportshoe-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - OLLAMA_KEEP_ALIVE=0
      - OLLAMA_NO_CLOUD=true
    volumes:
      - ${OLLAMA_MODELS_PATH:-ollama_models}:/root/.ollama/models
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$${OLLAMA_MODEL}"
        wait "$$pid"
    healthcheck:
      test: ["CMD-SHELL", "ollama show \"$${OLLAMA_MODEL}\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # 2. Container Spring Boot Backend
  backend:
    image: ${DOCKER_USERNAME:-tunganhsama}/sportshoe-backend:latest
    build:
      context: ./BE/server
      dockerfile: Dockerfile
    container_name: sportshoe-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_URL=${DB_URL:-jdbc:sqlserver://database:1433;databaseName=giay;encrypt=true;trustServerCertificate=true}
      - DB_USERNAME=sa
      - DB_PASSWORD=${DB_PASSWORD:-Yoasobi123.}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - GHN_BASE_URL=${GHN_BASE_URL:-https://online-gateway.ghn.vn/shiip/public-api}
      - GHN_TOKEN=${GHN_TOKEN:-}
      - GHN_SHOP_ID=${GHN_SHOP_ID:-0}
      - GHN_FROM_DISTRICT_ID=${GHN_FROM_DISTRICT_ID:-0}
      - GHN_FROM_WARD_CODE=${GHN_FROM_WARD_CODE:-}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE:-}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET:-}
      - VNPAY_PAY_URL=${VNPAY_PAY_URL:-}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL:-}
      - SEPAY_API_KEY=${SEPAY_API_KEY:-}
      - SEPAY_BANK=${SEPAY_BANK:-}
      - SEPAY_ACCOUNT_NUMBER=${SEPAY_ACCOUNT_NUMBER:-}
      - SEPAY_ACCOUNT_NAME=${SEPAY_ACCOUNT_NAME:-}
      - SEPAY_PREFIX=${SEPAY_PREFIX:-SHOE}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AI_LOCAL_FALLBACK_ENABLED=${AI_LOCAL_FALLBACK_ENABLED:-true}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_TEXT_MODEL=${OLLAMA_TEXT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-18000}
      - AI_CLOUD_REQUEST_TIMEOUT_SECONDS=${AI_CLOUD_REQUEST_TIMEOUT_SECONDS:-5}
      - AI_LOCAL_MAX_CONCURRENT=${AI_LOCAL_MAX_CONCURRENT:-1}
      - AI_LOCAL_QUEUE_WAIT_SECONDS=${AI_LOCAL_QUEUE_WAIT_SECONDS:-5}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      database:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped


  # 3. Container Vue.js Frontend
  frontend:
    image: ${DOCKER_USERNAME:-tunganhsama}/sportshoe-frontend:latest
    build:
      context: ./FE/sport-shoe
      dockerfile: Dockerfile
    container_name: sportshoe-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
  ollama_models:
