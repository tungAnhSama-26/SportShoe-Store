version: '3.8'

services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TungAnh@123456"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    restart: unless-stopped

  backend:
    build:
      context: ./BE/server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://db:1433;databaseName=giay;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=TungAnh@123456
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./FE/sport-shoe
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
